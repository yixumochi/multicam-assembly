<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From video to top view</title>
<style>
  :root{color-scheme:light;color:#172e2b;background:#f4f6f0;font:16px/1.55 system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0}
  main{max-width:1160px;margin:auto;padding:clamp(24px,5vw,64px) clamp(15px,4vw,46px) 32px}
  .case{margin:0;color:#126958;font-size:.8rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
  h1{font-size:clamp(2.15rem,5.6vw,4rem);font-weight:650;line-height:1.08;letter-spacing:-.045em;margin:8px 0 18px}
  figure{margin:0}
  video{display:block;width:100%;aspect-ratio:2/1;background:#e9f0eb;border:1px solid #d2ded4;border-radius:12px}
  figcaption{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 24px;margin-top:12px;color:#466258;font-size:.9rem}
  a{color:#126958;text-underline-offset:.22em}
  #pipeline{margin-top:clamp(28px,5vw,56px)}
  #pipeline h2{font-size:clamp(1.3rem,3vw,1.85rem);line-height:1.2;margin:0 0 14px}
  #pipeline img{display:block;width:100%;height:auto;background:white;border:1px solid #d2ded4;border-radius:12px}
  #pipeline p{font-size:.9rem;margin:10px 0 0}
</style>
</head>
<body>
<main>
  <p class="case"><a href="../index.html#v22-method">Start here / Methods</a> · V22 · Shot S01</p>
  <h1>From video to top view</h1>
  <figure id="workshop-plan">
    <video id="intro-video" controls muted playsinline preload="metadata"
      poster="assets/33_v22_workshop_video_poster.jpg" src="assets/32_v22_video_to_workshop_plan.mp4"
      aria-label="V22 demonstration of feature tracking, local top view and workshop plan placement"></video>
    <figcaption><span>V22 S01 · Local top view and placement on the workshop plan</span>
      <span><a href="../index.html#robotic-assembly/V22">V22 case record</a> · <a href="technical.html">Technical walkthrough</a></span>
    </figcaption>
  </figure>
  <section id="pipeline" aria-labelledby="pipeline-title">
    <h2 id="pipeline-title">Network and processing pipeline</h2>
    <figure>
      <a href="assets/14_visual_pipeline.svg"><img src="assets/14_visual_pipeline.png"
        alt="Processing diagram connecting V22 video, SAM2.1 masks, LK tracking, Depth Pro and the two top-view routes"
        width="2400" height="1308" loading="lazy"></a>
    </figure>
    <p><a href="technical.html#networks">SAM2.1 and Depth Pro architectures</a></p>
  </section>
</main>
<script>
  const video = document.getElementById('intro-video');
  if (location.hash === '#workshop-plan') {
    video.addEventListener('loadedmetadata', () => { video.currentTime = 14.08; }, {once: true});
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    video.muted = true;
    video.play().catch(() => {});
  }
  if (location.hash && document.querySelector('a[href="technical.html"]')) {
    const technicalSections = ['architecture','walk','branch-results','robot-update','v29','networks','animation','decisions','sources'];
    if (technicalSections.includes(location.hash.slice(1))) location.replace('technical.html' + location.hash);
  }
</script>
</body>
</html>
