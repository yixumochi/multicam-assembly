  <g id="text_26">
   <text style="font-size: 9px; font-family: 'Segoe UI'; text-anchor: start; fill: #17363b" x="50.112" y="358.416" transform="rotate(-0 50.112 358.416)">Endpoint changes are −7.2° and +3.2°. End grip descriptors are 0.44 and 0.12. The grip-descriptor RMS gap is 0.226.</text>
