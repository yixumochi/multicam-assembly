  <g id="text_29">
   <text style="font-size: 8px; font-family: 'Segoe UI'; text-anchor: start; fill: #4e6665" x="50.112" y="444.3264" transform="rotate(-0 50.112 444.3264)">Evidence status: recorded values. Video not checked. The labels suggest withdrawal; the exit path is not verified.</text>
