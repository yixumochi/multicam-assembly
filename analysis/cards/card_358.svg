  <g id="text_27">
   <text style="font-weight: 600; font-size: 8px; font-family: 'Segoe UI'; text-anchor: start; fill: #12627d" x="50.112" y="387.4176" transform="rotate(-0 50.112 387.4176)">Interface question</text>
